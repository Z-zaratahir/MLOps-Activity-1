name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/z-zaratahir/mlops-activity-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify release version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release metadata
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: echo "image=${IMAGE_NAME}:${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            APPLICATION_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy exact release image to staging
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io --username '${{ secrets.GHCR_USERNAME }}' --password-stdin
            docker pull ${{ needs.build.outputs.image }}
            docker rm --force mlops-api 2>/dev/null || true
            docker run --detach \
              --name mlops-api \
              --restart unless-stopped \
              --publish 5000:5000 \
              --env MODEL_VERSION='${{ vars.MODEL_VERSION || 'model-7' }}' \
              ${{ needs.build.outputs.image }}

      - name: Smoke test staging
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent "http://${{ secrets.STAGING_HOST }}:5000/health"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy exact staged image to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io --username '${{ secrets.GHCR_USERNAME }}' --password-stdin
            docker pull ${{ needs.build.outputs.image }}
            docker rm --force mlops-api 2>/dev/null || true
            docker run --detach \
              --name mlops-api \
              --restart unless-stopped \
              --publish 5000:5000 \
              --env MODEL_VERSION='${{ vars.MODEL_VERSION || 'model-7' }}' \
              ${{ needs.build.outputs.image }}