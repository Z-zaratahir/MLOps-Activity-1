services:
  mlops-api:
    build:
      context: .
      args:
        APPLICATION_VERSION: ${APPLICATION_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: mlops-cd-demo:${APPLICATION_VERSION:-1.0.0}
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-model-7}
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3